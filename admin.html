<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sazal Study | Admin Dashboard</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f8fc;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#172033}.wrap{max-width:1050px;margin:25px auto;padding:0 16px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.head h1{margin:0;font-size:26px}.back{color:#2563eb;text-decoration:none}.panel{background:#fff;padding:22px;border-radius:20px;box-shadow:0 8px 30px #17203312;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat{background:#f8fafc;border:1px solid #e5e7eb;border-radius:14px;padding:15px}.stat b{display:block;font-size:25px}.row{display:grid;gap:8px;margin-bottom:15px}label{font-weight:750;font-size:14px}input,select{padding:12px;border:1px solid #dbe1ea;border-radius:10px;font-size:15px;width:100%}.btn{border:0;background:#2563eb;color:#fff;padding:12px 15px;border-radius:10px;font-weight:800;cursor:pointer}.muted{background:#64748b}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #eee}.small{font-size:13px;color:#64748b}.msg{padding:11px;border-radius:10px;background:#eef2ff;margin:12px 0;display:none}.hidden{display:none}.tools{display:flex;gap:10px;flex-wrap:wrap}.status{font-size:13px;color:#64748b}.search{flex:1;min-width:200px}.hint{background:#f8fafc;padding:12px;border-radius:12px;color:#64748b;font-size:13px}@media(max-width:650px){.stats{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.item{align-items:flex-start;flex-direction:column}.item .btn{width:100%}}
</style></head><body><div class="wrap"><div class="head"><h1>🔐 Sazal Study Admin Dashboard</h1><div><span id="status" class="status"></span> &nbsp; <a class="back" href="index.html">← Website</a></div></div>
<div id="loginPanel" class="panel"><h2>🔑 Admin Login</h2><p class="small">अपने Supabase Auth account से login करें।</p><div class="row"><label>Email</label><input id="email" type="email" placeholder="Admin email"></div><div class="row"><label>Password</label><input id="password" type="password" placeholder="Password"></div><button class="btn" id="login">🔓 Login</button><div id="loginMsg" class="msg"></div></div>
<div id="app" class="hidden"><div class="stats"><div class="stat">📚 Total Notes<b id="total">0</b></div><div class="stat">🎓 Classes<b id="classes">0</b></div><div class="stat">📖 Subjects<b id="subjects">0</b></div></div>
<div class="panel" id="upload"><h2>📤 Upload New Material</h2><div class="row"><label>Title</label><input id="title" placeholder="जैसे: Class 12 English Chapter 1 Notes"></div><div class="row"><label>Class / Category</label><select id="category"><option>Nursery</option><option>LKG</option><option>UKG</option><option>Class 1</option><option>Class 2</option><option>Class 3</option><option>Class 4</option><option>Class 5</option><option>Class 6</option><option>Class 7</option><option>Class 8</option><option>Class 9</option><option>Class 10</option><option>Class 11</option><option>Class 12</option><option>Bihar Board</option><option>GK</option><option>Important Questions</option><option>Reasoning</option><option>Brain Booster</option><option>English</option><option>Hindi</option><option>Mathematics</option><option>Science</option><option>Social Science</option></select></div><div class="row"><label>Subject</label><input id="subject" placeholder="जैसे: Hindi, English, Physics, Chemistry, Biology, Math, Social Science"></div><div class="row"><label>PDF / Image / File</label><input id="file" type="file" accept=".pdf,image/*"></div><div class="tools"><button class="btn" id="add">➕ Upload & Publish</button><button class="btn muted" id="logout">Logout</button></div><div id="uploadMsg" class="msg"></div><div class="hint">आपकी file <b>study-files</b> bucket में जाएगी और metadata <b>notes</b> table में save होगा।</div></div>
<div class="panel"><div class="tools"><h2 style="margin:0;flex:1">📚 Published Material</h2><input id="adminSearch" class="search" placeholder="Search published notes..."></div><div id="list"></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const $=id=>document.getElementById(id);let all=[];function showMsg(el,text,error=false){el.textContent=text;el.style.display='block';el.style.background=error?'#fee2e2':'#eef2ff'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function stats(data){$('total').textContent=data.length;$('classes').textContent=new Set(data.map(x=>x.class).filter(Boolean)).size;$('subjects').textContent=new Set(data.map(x=>x.subject).filter(Boolean)).size}
function render(list){$('list').innerHTML=list.length?list.map(n=>`<div class="item"><div><b>${esc(n.title)}</b><div class="small">${esc(n.class||'')} • ${esc(n.subject||'')} • ${esc(n.file_name||'')}</div></div><div class="tools"><a class="btn" href="${esc(n.file_url)}" target="_blank" rel="noopener">Open</a><button class="btn" style="background:#dc2626" data-delete="${esc(n.id)}">🗑️ Delete</button></div></div>`).join(''):'<p class="small">कोई material नहीं।</p>';document.querySelectorAll('[data-delete]').forEach(btn=>btn.onclick=()=>deleteNote(btn.dataset.delete))}
async function refresh(){const {data,error}=await sb.from('notes').select('*').order('created_at',{ascending:false});if(error){$('list').innerHTML='<p class="small">Notes load नहीं हो पाए: '+esc(error.message)+'</p>';return}all=data||[];stats(all);render(all)}
$('adminSearch').oninput=e=>{const q=e.target.value.toLowerCase();render(all.filter(n=>(n.title+' '+n.subject+' '+n.class+' '+n.file_name).toLowerCase().includes(q)))};
function getStoragePath(fileUrl){try{const u=new URL(fileUrl);const marker='/storage/v1/object/public/study-files/';const i=u.pathname.indexOf(marker);return i>=0?decodeURIComponent(u.pathname.slice(i+marker.length)):null}catch(e){return null}}
async function deleteNote(id){const note=all.find(n=>String(n.id)===String(id));if(!note)return;if(!confirm(`“${note.title}” को permanently delete करना है?`))return;try{const path=getStoragePath(note.file_url);if(path){const rm=await sb.storage.from('study-files').remove([path]);if(rm.error)throw new Error('File delete failed: '+rm.error.message)}const del=await sb.from('notes').delete().eq('id',note.id);if(del.error)throw del.error;showMsg($('uploadMsg'),'✅ Note और file successfully delete हो गए।');await refresh()}catch(e){showMsg($('uploadMsg'),'Delete failed: '+(e?.message||e),true)}};
async function updateUI(){const {data:{session}}=await sb.auth.getSession();if(session){$('loginPanel').classList.add('hidden');$('app').classList.remove('hidden');$('status').textContent=session.user.email||'';refresh()}else{$('loginPanel').classList.remove('hidden');$('app').classList.add('hidden');$('status').textContent=''}}
$('login').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password){showMsg($('loginMsg'),'Email और password भरें।',true);return}$('login').disabled=true;$('login').textContent='Logging in...';try{const r=await Promise.race([sb.auth.signInWithPassword({email,password}),new Promise((_,rej)=>setTimeout(()=>rej(new Error('Login request timeout.')),15000))]);if(r.error)throw r.error;$('loginMsg').style.display='none';await updateUI()}catch(e){showMsg($('loginMsg'),'Login failed: '+(e?.message||e),true)}finally{$('login').disabled=false;$('login').textContent='🔓 Login'}};
$('logout').onclick=async()=>{await sb.auth.signOut();updateUI()};$('add').onclick=async()=>{const title=$('title').value.trim(),subject=$('subject').value.trim(),file=$('file').files[0],category=$('category').value;if(!title||!file){showMsg($('uploadMsg'),'Title और file दोनों चुनें।',true);return}$('add').disabled=true;$('add').textContent='Uploading...';try{const {data:{user}}=await sb.auth.getUser();if(!user)throw new Error('Admin login required');const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=user.id+'/'+Date.now()+'-'+safe;const up=await sb.storage.from('study-files').upload(path,file,{contentType:file.type||'application/octet-stream',upsert:false});if(up.error)throw up.error;const pub=sb.storage.from('study-files').getPublicUrl(path);const ins=await sb.from('notes').insert({title,class:category,subject,file_url:pub.data.publicUrl,file_name:file.name,file_type:file.type||''}).select().single();if(ins.error)throw ins.error;$('title').value='';$('subject').value='';$('file').value='';showMsg($('uploadMsg'),'✅ Material successfully publish हो गया!');refresh()}catch(e){showMsg($('uploadMsg'),'Upload failed: '+e.message,true)}finally{$('add').disabled=false;$('add').textContent='➕ Upload & Publish'}};
updateUI();if(location.hash==='#upload'){setTimeout(()=>document.getElementById('upload')?.scrollIntoView({behavior:'smooth',block:'start'}),300)}sb.auth.onAuthStateChange((event,session)=>{if(session){$('loginPanel').classList.add('hidden');$('app').classList.remove('hidden');$('status').textContent=session.user.email||'';refresh()}else{$('loginPanel').classList.remove('hidden');$('app').classList.add('hidden');$('status').textContent=''}});
</script></body></html>

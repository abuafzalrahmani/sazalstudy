<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f5f7fb;color:#172033}
.hero{background:linear-gradient(135deg,#173ea5,#6d28d9);color:#fff;padding:20px 16px 68px}.wrap{max-width:1180px;margin:auto}
.nav{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-size:25px;font-weight:900}.tag{font-size:13px;opacity:.9}.admin{color:#fff;text-decoration:none;border:1px solid #ffffff55;padding:9px 13px;border-radius:10px;background:#ffffff12}
.hero h1{font-size:42px;margin:38px 0 8px}.hero p{margin:0 0 20px;opacity:.92}.search{width:100%;padding:16px 18px;border:0;border-radius:15px;font-size:16px;outline:none;box-shadow:0 10px 30px #0002}
.main{max-width:1180px;margin:-30px auto 45px;padding:0 16px}.panel{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 30px #17203312;margin-bottom:20px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.panel h2{margin:0 0 16px}
.class-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.class-card{border:1px solid #e2e8f0;background:linear-gradient(180deg,#fff,#f8faff);border-radius:16px;padding:15px;text-align:center;cursor:pointer;transition:.2s;box-shadow:0 3px 12px #17203308}.class-card:hover,.class-card.active{transform:translateY(-2px);border-color:#818cf8;background:#eef2ff;box-shadow:0 8px 18px #4338ca18}.class-icon{font-size:25px}.class-name{font-weight:850;margin-top:6px}.class-sub{font-size:12px;color:#64748b;margin-top:3px}
.subject-wrap{margin-top:22px}.subject-section{margin:18px 0}.subject-title{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:900;margin-bottom:11px;padding-bottom:8px;border-bottom:1px solid #edf0f5}.subject-dot{width:9px;height:9px;border-radius:50%;background:#6366f1;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px}.card{border:1px solid #e5e7eb;border-radius:16px;padding:17px;background:#fff;display:flex;flex-direction:column;min-height:190px;box-shadow:0 4px 14px #17203308}.badge{display:inline-block;align-self:flex-start;background:#eef2ff;color:#4338ca;padding:5px 9px;border-radius:8px;font-size:12px;font-weight:800}.card h3{margin:11px 0 7px;font-size:18px}.meta{color:#64748b;font-size:13px;line-height:1.5;margin-bottom:15px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}.btn{display:inline-block;text-decoration:none;background:#2563eb;color:#fff;padding:10px 11px;border-radius:10px;font-weight:800;text-align:center}.btn.download{background:#0f766e}.empty{text-align:center;color:#64748b;padding:30px}.count{color:#64748b;font-size:13px}.hint{background:#f8fafc;border-radius:12px;padding:11px;color:#64748b;font-size:13px;margin-bottom:15px}footer{text-align:center;color:#64748b;padding:28px 16px}
@media(max-width:600px){.hero h1{font-size:31px}.brand{font-size:21px}.admin{font-size:12px}.panel{padding:16px}.class-grid{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.card{min-height:175px}}
</style></head>
<body>
<header class="hero"><div class="wrap"><div class="nav"><div><div class="brand">📚 Sazal Study</div><div class="tag">आपकी पढ़ाई, आपकी तैयारी</div></div><a class="admin" href="admin.html">🔐 Admin</a></div><h1>Study Notes & PDFs</h1><p>Class, subject और important study material एक ही जगह।</p><input id="search" class="search" placeholder="🔍 Notes, subject, class या file name खोजें..."></div></header>
<main class="main">
<section class="panel">
 <div class="panel-head"><h2>🎓 Classes</h2><button id="clear" class="class-card" style="padding:8px 13px;border-radius:10px">✕ All Classes</button></div>
 <div class="class-grid" id="classGrid"></div>
</section>
<section class="panel">
 <div class="panel-head"><h2 id="materialHeading">📚 Latest Study Material</h2><span id="count" class="count"></span></div>
 <div class="hint">💡 पहले Class चुनें, फिर उसी Class के अंदर Subject के हिसाब से PDFs देखें।</div>
 <div id="notes"></div>
</section>
</main>
<footer>© 2026 Sazal Study • Study Material Portal</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
const box=document.getElementById('notes'),search=document.getElementById('search'),count=document.getElementById('count'),classGrid=document.getElementById('classGrid'),heading=document.getElementById('materialHeading');
let current=[],active='';
const classes=['Nursery','LKG','UKG','Class 1','Class 2','Class 3','Class 4','Class 5','Class 6','Class 7','Class 8','Class 9','Class 10','Class 11','Class 12'];
const icons=['🌱','🧸','🎒','1️⃣','2️⃣','3️⃣','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣','9️⃣','🔟','🎓','🏆'];
const subjectOrder=['Hindi','English','Urdu','Physics','Chemistry','Biology','Mathematics','Math','Social Science','General','Other'];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function slugDownload(url,name){try{const u=new URL(url);u.searchParams.set('download',name||'study.pdf');return u.toString()}catch(e){return url}}
function makeClassCards(){
 classGrid.innerHTML=classes.map((c,i)=>`<button class="class-card ${active===c?'active':''}" data-class="${esc(c)}"><div class="class-icon">${icons[i]}</div><div class="class-name">${esc(c)}</div><div class="class-sub">Study Material</div></button>`).join('');
 classGrid.querySelectorAll('[data-class]').forEach(b=>b.onclick=()=>{active=b.dataset.class;search.value='';makeClassCards();apply()});
}
function card(n){
 const dl=slugDownload(n.file_url,n.file_name||'study.pdf');
 return `<article class="card"><span class="badge">${esc(n.class||'Study')}</span><h3>${esc(n.title||'Untitled')}</h3><div class="meta">📚 ${esc(n.subject||'General')}${n.file_name?' • 📄 '+esc(n.file_name):''}</div>${n.file_url?`<div class="actions"><a class="btn" target="_blank" rel="noopener" href="${esc(n.file_url)}">👁️ View PDF</a><a class="btn download" target="_blank" rel="noopener" download="${esc(n.file_name||'study.pdf')}" href="${esc(dl)}">⬇️ Download</a></div>`:''}</article>`;
}
function render(list){
 count.textContent=list.length+' material';
 if(!list.length){box.innerHTML='<div class="empty">😕 कोई material नहीं मिला। दूसरी Class/Subject या search try करें।</div>';return}
 const groups={};
 list.forEach(n=>{const key=n.subject||'General';(groups[key]??=[]).push(n)});
 const keys=Object.keys(groups).sort((a,b)=>{let ia=subjectOrder.indexOf(a),ib=subjectOrder.indexOf(b);if(ia<0)ia=99;if(ib<0)ib=99;return ia-ib||a.localeCompare(b)});
 box.innerHTML=keys.map(sub=>`<section class="subject-section"><div class="subject-title"><span class="subject-dot"></span>${esc(sub)} <span class="count">(${groups[sub].length})</span></div><div class="grid">${groups[sub].map(card).join('')}</div></section>`).join('');
}
function apply(){
 const q=search.value.trim().toLowerCase();
 const list=current.filter(n=>{
  const text=(n.title+' '+n.subject+' '+n.class+' '+n.file_name).toLowerCase();
  return (!q||text.includes(q))&&(!active||String(n.class||'').toLowerCase()===active.toLowerCase());
 });
 heading.textContent=active?`📚 ${active} — Subjects & PDFs`:'📚 Latest Study Material';
 render(list);
}
async function load(){
 box.innerHTML='<div class="empty">⏳ Notes load हो रहे हैं...</div>';
 const {data,error}=await sb.from('notes').select('*').order('created_at',{ascending:false});
 if(error){box.innerHTML='<div class="empty">Notes load नहीं हो पाए।</div>';console.error(error);return}
 current=data||[];makeClassCards();apply();
}
search.oninput=apply;
document.getElementById('clear').onclick=()=>{active='';search.value='';makeClassCards();apply()};
makeClassCards();load();
</script></body></html>

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sazal Study | Notes & PDFs</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f6f8fc;color:#172033}.hero{background:linear-gradient(135deg,#1d4ed8,#7c3aed);color:#fff;padding:22px 16px 60px}.wrap{max-width:1150px;margin:auto}.nav{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-size:25px;font-weight:900}.tag{font-size:13px;opacity:.9}.admin{color:#fff;text-decoration:none;border:1px solid #ffffff66;padding:9px 13px;border-radius:10px}.hero h1{font-size:40px;margin:38px 0 8px}.hero p{margin:0 0 20px;opacity:.92}.search{width:100%;padding:15px 18px;border:0;border-radius:14px;font-size:16px;outline:none;box-shadow:0 8px 25px #0002}.main{max-width:1150px;margin:-28px auto 45px;padding:0 16px}.panel{background:#fff;border-radius:20px;padding:22px;box-shadow:0 8px 30px #17203312;margin-bottom:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.panel h2{margin:0 0 16px}.chips{display:flex;gap:9px;overflow:auto;padding-bottom:4px}.chip{border:1px solid #e2e8f0;background:#fff;padding:9px 13px;border-radius:999px;white-space:nowrap;cursor:pointer;font-weight:700}.chip.active,.chip:hover{background:#eef2ff;border-color:#818cf8;color:#3730a3}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{border:1px solid #e5e7eb;border-radius:16px;padding:18px;background:#fff;display:flex;flex-direction:column;min-height:185px}.badge{display:inline-block;align-self:flex-start;background:#eef2ff;color:#4338ca;padding:5px 9px;border-radius:8px;font-size:12px;font-weight:800}.card h3{margin:11px 0 7px;font-size:18px}.meta{color:#64748b;font-size:13px;line-height:1.5;margin-bottom:16px}.btn{display:inline-block;text-decoration:none;background:#2563eb;color:#fff;padding:10px 13px;border-radius:10px;font-weight:800;text-align:center;margin-top:auto}.empty{text-align:center;color:#64748b;padding:30px}.count{color:#64748b;font-size:13px}footer{text-align:center;color:#64748b;padding:28px 16px}@media(max-width:600px){.hero h1{font-size:31px}.brand{font-size:21px}.admin{font-size:12px}.panel{padding:17px}}
</style></head>
<body>
<header class="hero"><div class="wrap"><div class="nav"><div><div class="brand">📚 Sazal Study</div><div class="tag">आपकी पढ़ाई, आपकी तैयारी</div></div><a class="admin" href="admin.html">🔐 Admin</a></div><h1>Study Notes & PDFs</h1><p>Class, subject और important study material एक ही जगह।</p><input id="search" class="search" placeholder="🔍 Notes, subject, class या file name खोजें..."></div></header>
<main class="main"><section class="panel"><div class="panel-head"><h2>🎓 Classes & Categories</h2><button id="clear" class="chip">✕ Clear</button></div><div class="chips" id="chips"><button class="chip" data-filter="Class 6">Class 6</button><button class="chip" data-filter="Class 7">Class 7</button><button class="chip" data-filter="Class 8">Class 8</button><button class="chip" data-filter="Class 10">Class 10</button><button class="chip" data-filter="Class 11">Class 11</button><button class="chip" data-filter="Class 12">Class 12</button><button class="chip" data-filter="Bihar Board">Bihar Board</button><button class="chip" data-filter="GK">🧠 GK</button><button class="chip" data-filter="Important Questions">📝 Important Questions</button></div></section>
<section class="panel"><div class="panel-head"><h2>📄 Latest Study Material</h2><span id="count" class="count"></span></div><div id="notes" class="grid"></div></section></main>
<footer>© 2026 Sazal Study • Study Material Portal</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
const box=document.getElementById('notes'),search=document.getElementById('search'),count=document.getElementById('count');let current=[];let active='';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(list){count.textContent=list.length+' material';box.innerHTML='';if(!list.length){box.innerHTML='<div class="empty">😕 कोई material नहीं मिला। Search या category बदलकर देखें।</div>';return}list.forEach(n=>{const d=document.createElement('article');d.className='card';d.innerHTML=`<span class="badge">${esc(n.class||'Study')}</span><h3>${esc(n.title||'Untitled')}</h3><div class="meta">${esc(n.subject||'General')} ${n.file_name?'• '+esc(n.file_name):''}</div>${n.file_url?`<a class="btn" target="_blank" rel="noopener" href="${esc(n.file_url)}">📖 View / Download</a>`:''}`;box.appendChild(d)})}
function apply(){const q=search.value.trim().toLowerCase();const list=current.filter(n=>{const text=(n.title+' '+n.subject+' '+n.class+' '+n.file_name).toLowerCase();return (!q||text.includes(q))&&(!active||text.includes(active.toLowerCase()))});render(list)}
async function load(){box.innerHTML='<div class="empty">⏳ Notes load हो रहे हैं...</div>';const {data,error}=await sb.from('notes').select('*').order('created_at',{ascending:false});if(error){box.innerHTML='<div class="empty">Notes load नहीं हो पाए।</div>';console.error(error);return}current=data||[];apply()}
search.oninput=apply;document.querySelectorAll('[data-filter]').forEach(c=>c.onclick=()=>{active=c.dataset.filter;search.value='';document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));c.classList.add('active');apply()});document.getElementById('clear').onclick=()=>{active='';search.value='';document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));apply()};load();
</script></body></html>
